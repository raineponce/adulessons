<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxes - Lesson | aduLessons</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">

    <!-- Global styles -->
    <!-- <link rel="stylesheet" href="./styles/global.css"> -->

    <!-- Page-specific internal styles -->
    <style>
        /* CSS Variables */
        :root {
            --color-primary: #1a1a2e;
            --color-pink: #ffc8d0;
            --color-pink-border: #e8a0aa;
            --color-pink-hover: #ffb8c4;
            --color-white: #ffffff;
            --color-text-dark: #2d2d2d;
            --color-text-muted: #6b7280;
            --color-accent-blue: #4a6fa5;
            --color-light-blue: #d4e5f7;
            --color-gold: #ffd700;
            --color-gold-border: #daa520;
            --font-display: 'Fredoka', sans-serif;
            --font-body: 'Nunito Sans', sans-serif;
        }

        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--color-white);
            color: var(--color-text-dark);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Navigation Styles */
        #navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--color-white);
            border-bottom: 1px solid #eee;
        }

        .nav-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--color-primary);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1;
        }

        .logo-bowtie {
            width: 24px;
            height: auto;
            margin-top: 4px;
        }

        .search-container {
            flex: 0 1 300px;
            margin: 0 2rem;
        }

        .search-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f5f5f5;
            border-radius: 25px;
            padding: 0.5rem 1rem;
        }

        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            font-family: var(--font-body);
            font-size: 0.95rem;
            outline: none;
            color: var(--color-text-muted);
        }

        .search-box input::placeholder {
            color: var(--color-text-muted);
        }

        .search-box svg {
            color: var(--color-text-muted);
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            margin-left: 0.5rem;
        }

        .nav-links {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 2rem;
        }

        .nav-link {
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-text-dark);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .nav-link:hover {
            color: var(--color-accent-blue);
        }

        .user-section {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        .user-avatar-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            transition: transform 0.2s ease;
        }

        .user-avatar-link:hover {
            transform: scale(1.05);
        }

        .avatar-img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid var(--color-gold);
            object-fit: cover;
            background: #f0e6d3;
        }

        .user-name {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--color-text-dark);
        }

        .points-badge-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            transition: transform 0.2s ease;
            padding-top: 8px;
        }

        .points-badge-link:hover {
            transform: scale(1.05);
        }

        .points-text {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--color-text-dark);
        }

        /* Main Content Styles */
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            min-height: calc(100vh - 100px);
        }

        /* Navigation Arrows */
        .nav-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            position: sticky;
            top: 168.84px;
        }

        .nav-arrow {
            background: var(--color-white);
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--color-text-dark);
        }

        .nav-arrow:hover {
            background: #f5f5f5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .nav-arrow:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .nav-arrow svg {
            width: 24px;
            height: 24px;
        }

        .back-button {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--color-text-dark);
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .back-button svg {
            width: 24px;
            height: 24px;
        }

        .back-button:hover {
            transform: translateX(-3px);
        }

        /* Lesson Content */
        .lesson-page {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .lesson-page.active {
            display: block;
        }

        .status-box {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 0.9rem 1rem;
            margin: 0 auto 1rem;
            max-width: 700px;
            color: var(--color-text-muted);
            background: #fafafa;
            font-size: 0.95rem;
        }

        .status-box.hidden {
            display: none;
        }

        .status-box.error {
            background: #fff2f2;
            border-color: #f6caca;
            color: #8c2b2b;
        }

        .status-actions {
            margin-top: 0.75rem;
        }

        .retry-button {
            border: 1px solid #d1d5db;
            background: #ffffff;
            border-radius: 999px;
            padding: 0.4rem 0.9rem;
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 700;
            color: var(--color-text-dark);
        }

        .retry-button:hover {
            background: #f3f4f6;
        }

        .lesson-image {
            display: block;
            width: 100%;
            max-width: 540px;
            border-radius: 14px;
            margin: 1rem auto 1.5rem;
        }

        .video-frame {
            width: 100%;
            max-width: 640px;
            aspect-ratio: 16 / 9;
            border: 0;
            border-radius: 14px;
            margin: 0 auto 1.5rem;
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .lesson-content {
            max-width: 700px;
            margin: 0 auto;
            padding: 1rem 0;
        }

        .lesson-title {
            font-family: var(--font-body);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-text-dark);
            margin-bottom: 1.5rem;
        }

        .lesson-text {
            font-family: var(--font-body);
            font-size: 1.125rem;
            line-height: 1.8;
            color: var(--color-text-dark);
            margin-bottom: 1.5rem;
        }

        .section-heading {
            font-family: var(--font-body);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--color-text-dark);
            margin-top: 2rem;
            margin-bottom: 1rem;
        }

        .lesson-list {
            margin: 1rem 0 1.5rem 1.5rem;
            font-size: 1.125rem;
            line-height: 2;
        }

        .lesson-list li {
            margin-bottom: 0.5rem;
        }

        .lesson-list li strong {
            font-weight: 700;
        }

        .nested-list {
            margin-top: 0.5rem;
            margin-left: 1.5rem;
            list-style-type: disc;
        }

        .nested-list li {
            margin-bottom: 0.25rem;
        }

        .lesson-link {
            color: var(--color-accent-blue);
            text-decoration: underline;
        }

        .lesson-link:visited {
            color: var(--color-accent-blue);
        }

        .lesson-link:hover {
            color: var(--color-accent-blue);
        }

        /* Conclusion Box */
        .conclusion-box {
            background: var(--color-light-blue);
            border-radius: 16px;
            padding: 1.5rem 2rem;
            margin: 2rem 0;
        }

        .conclusion-box .section-heading {
            margin-top: 0;
        }

        /* Quiz Button */
        .quiz-button-container {
            display: flex;
            justify-content: center;
            margin: 3rem 0 2rem;
        }

        .quiz-button {
            display: inline-block;
            background: var(--color-accent-blue);
            color: var(--color-white);
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 600;
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .quiz-button:hover {
            background: #3d5d8a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 111, 165, 0.3);
        }

        /* Responsive Styles */
        @media (max-width: 1200px) {
            .nav-row {
                padding: 0;
            }
        }

        @media (max-width: 1024px) {
            .nav-arrow {
                width: 40px;
                height: 40px;
            }
        }

        @media (max-width: 768px) {
            .nav-container {
                flex-wrap: wrap;
                gap: 1rem;
                padding: 1rem;
            }

            .search-container {
                order: 3;
                flex: 1 1 100%;
                margin: 0;
            }

            main {
                padding: 1.5rem 1rem;
            }

            .lesson-title {
                font-size: 1.25rem;
            }

            .lesson-text {
                font-size: 1rem;
            }

            .section-heading {
                font-size: 1.125rem;
            }

            .lesson-list {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .user-section {
                gap: 0.5rem;
            }

            .avatar-img {
                width: 40px;
                height: 40px;
            }

            .quiz-button {
                font-size: 1rem;
                padding: 0.875rem 2rem;
            }
        }
    </style>
</head>

<body>
    <!-- Navigation component loads here -->
    <nav id="navbar">
        <!-- Placeholder navigation - will be replaced by components.js -->
    </nav>

    <main>
        <!-- Navigation Row with Back and Next buttons -->
        <div class="nav-row">
            <button class="back-button" id="backBtn" aria-label="Go back">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>

            <button class="nav-arrow" id="nextBtn" aria-label="Next page">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>
        </div>

        <div id="pageState" class="status-box hidden" aria-live="polite"></div>
        <div id="lessonPages"></div>
    </main>

    <!-- Footer component loads here -->
    <footer id="footer"></footer>

    <!-- Load components -->
    <script src="./js/components.js"></script>
    <script src="./js/hamburger-menu.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/pages/lessons/lesson-taxes.js"></script>
</body>

</html>
