<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aduLessons | Sign Up (Test)</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">

    <!-- Page-specific internal styles -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: #333;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .signup-container {
            background-color: #C8E7FF;
            padding: 2rem;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid black;
            box-shadow: 6px 6px 0px #2B5B8B;
            position: relative;
            margin-top: -3rem;
        }

        .signup-container h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #000000;
        }

        .signup-container p {
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            color: #000000;
        }

        .signup-container input {
            width: 100%;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
            border: none;
            border-radius: 15px;
            font-size: 0.95rem;
            font-family: 'Nunito Sans', sans-serif;
            box-shadow: 0px 2px 2px #7d7f7c;
        }

        .signup-container input::placeholder {
            color: #676662;
        }

        .signup-container .signup-btn {
            width: 130px;
            padding: 0.8rem;
            background-color: #2f5c96;
            border: none;
            border-radius: 20px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 0.75rem;
            font-family: 'Nunito Sans', sans-serif;
            box-shadow: 0px 2px 2px #7d7f7c;
        }

        .signup-container .login-link {
            font-size: 0.85rem;
            color: #000000;
        }

        .signup-container .login-link a {
            font-weight: 600;
            text-decoration: underline;
            color: #000000;
        }

        .signup-mascot {
            position: absolute;
            left: -180px;
            bottom: -10px;
            width: 220px;
        }

        .top-header {
            padding: 1.5rem 1.5rem;
        }

        .logo-link img {
            height: 60px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .logo-link img:hover {
            transform: scale(1.05);
        }

        #register-error {
            color: #c0392b;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }

        @media (max-width: 500px) {
            .signup-container {
                padding: 1.5rem;
            }

            .signup-mascot {
                left: -60px;
                width: 90px;
            }
        }
    </style>
</head>

<body>
    <header class="top-header">
        <span class="logo-link">
            <img src="./assets/images/logo-1.png" alt="aduLessons logo">
        </span>
    </header>

    <main>
        <div class="signup-container">
            <h1>Sign Up</h1>
            <p>Learn key adulting skills today!</p>

            <form id="register-form">
                <input type="text" id="register-username" placeholder="Enter Display Name" required>
                <input type="email" id="register-email" placeholder="Your Email" required>
                <input type="password" id="register-password" placeholder="Your Password" required>
                <button type="submit" class="signup-btn">Sign Up</button>
            </form>
            <div id="register-error"></div>

            <div class="login-link">
                Already have an account? <a href="loginTest.html">Log in</a>
            </div>

            <img src="./assets/images/mascot-pointer.png" alt="Mascot" class="signup-mascot">
        </div>
    </main>

    <footer id="footer"></footer>

    <script>
      // Utils
      async function apiFetch(url, options = {}) {
        const defaults = { headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' } };
        const mergedOptions = { ...defaults, ...options, headers: { ...defaults.headers, ...(options.headers || {}) } };
        const res = await fetch(url, mergedOptions);
        const data = await res.json();
        return { ok: res.ok, status: res.status, data };
      }
      function showError(elementId, message) {
        const el = document.getElementById(elementId);
        if (!el) return;
        el.textContent = message;
        el.style.display = 'block';
      }
      function clearMessage(elementId) {
        const el = document.getElementById(elementId);
        if (!el) return;
        el.textContent = '';
        el.style.display = 'none';
      }

      // Register
      const USERNAME_REGEX = /^[a-zA-Z0-9]{3,20}$/;
      const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.com$/i;
      const PASSWORD_MIN_LENGTH = 8;

      document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('register-form');
        if (form) form.addEventListener('submit', handleRegister);
      });

      async function handleRegister(e) {
        e.preventDefault();
        clearMessage('register-error');

        const username = document.getElementById('register-username').value.trim();
        const email = document.getElementById('register-email').value.trim();
        const password = document.getElementById('register-password').value;

        if (!USERNAME_REGEX.test(username)) {
          const msg = 'Username must be 3–20 characters, letters and numbers only.';
          console.error('[Register] Validation error:', msg);
          showError('register-error', msg);
          return;
        }
        if (!EMAIL_REGEX.test(email)) {
          const msg = 'Please enter a valid email address ending in .com';
          console.error('[Register] Validation error:', msg);
          showError('register-error', msg);
          return;
        }
        if (password.length < PASSWORD_MIN_LENGTH) {
          const msg = 'Password must be at least 8 characters.';
          console.error('[Register] Validation error:', msg);
          showError('register-error', msg);
          return;
        }

        try {
          const { ok, data } = await apiFetch('/auth/register', {
            method: 'POST',
            body: JSON.stringify({ username, email, password })
          });

          if (!ok) {
            const msg = data.error || 'Registration failed. Please try again.';
            console.error('[Register] Server error:', msg);
            showError('register-error', msg);
            return;
          }

          console.log('[Register] Success — user saved:', { username, email });
        } catch (err) {
          console.error('[Register] Unexpected error:', err);
          showError('register-error', 'Something went wrong. Please try again.');
        }
      }
    </script>

</body>

</html>
