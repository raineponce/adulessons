<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aduLessons | Login (Test)</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">

    <!-- Page-specific internal styles -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .login-container {
            position: relative;
            background-color: #C8E7FF;
            padding: 2rem;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid black;
            box-shadow: 6px 6px 0px #2B5B8B;
            margin-top: -3rem;
        }

        .login-container h1 {
            font-family: 'Fredoka', sans-serif;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
            color: #000;
        }

        .login-container p {
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            color: #000;
        }

        .login-container input {
            width: 100%;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
            border: none;
            border-radius: 15px;
            font-size: 0.95rem;
            font-family: 'Nunito Sans', sans-serif;
            box-shadow: 0px 2px 2px #7d7f7c;
        }

        .login-container input::placeholder {
            color: #676662;
        }

        .login-container .login-btn {
            width: 130px;
            padding: 0.8rem;
            background-color: #2f5c96;
            border: none;
            border-radius: 20px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            margin: 0.75rem auto;
            display: block;
            font-family: 'Nunito Sans', sans-serif;
            box-shadow: 0px 2px 2px #7d7f7c;
        }

        .login-container .signup-link {
            font-size: 0.85rem;
            color: #000;
        }

        .login-container .signup-link a {
            font-weight: 600;
            text-decoration: underline;
            color: #000;
        }

        .login-mascot {
            position: absolute;
            left: -180px;
            bottom: -10px;
            width: 220px;
        }

        .top-header {
            padding: 1.5rem 1.5rem;
        }

        .logo-link img {
            height: 60px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .logo-link img:hover {
            transform: scale(1.05);
        }

        #login-error {
            color: #c0392b;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }

        @media (max-width: 500px) {
            .login-container {
                padding: 1.5rem;
            }

            .login-mascot {
                left: -60px;
                width: 90px;
            }
        }
    </style>
</head>

<body>
    <header class="top-header">
        <a href="./welcome.html" class="logo-link">
            <img src="./assets/images/logo-1.png" alt="aduLessons logo">
        </a>
    </header>

    <main>
        <div class="login-container">
            <h1>Let's Grow Together</h1>
            <p>Please log in or sign up to continue.</p>

            <form id="login-form">
                <input type="email" id="login-email" placeholder="Your Email" required>
                <input type="password" id="login-password" placeholder="Your Password" required>
                <button type="submit" class="login-btn">Login</button>
            </form>
            <div id="login-error"></div>

            <div class="signup-link">
                No account? <a href="signupTest.html">Sign up</a>
            </div>

            <img src="./assets/images/mascot-pointer.png" alt="Mascot" class="login-mascot">
        </div>
    </main>

    <footer id="footer"></footer>

    <script>
        // Utils
        async function apiFetch(url, options = {}) {
            const defaults = { headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' } };
            const mergedOptions = { ...defaults, ...options, headers: { ...defaults.headers, ...(options.headers || {}) } };
            const res = await fetch(url, mergedOptions);
            const data = await res.json();
            return { ok: res.ok, status: res.status, data };
        }
        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            if (!el) return;
            el.textContent = message;
            el.style.display = 'block';
        }
        function clearMessage(elementId) {
            const el = document.getElementById(elementId);
            if (!el) return;
            el.textContent = '';
            el.style.display = 'none';
        }

        // Login
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            if (form) form.addEventListener('submit', handleLogin);
        });

        async function handleLogin(e) {
            e.preventDefault();
            clearMessage('login-error');

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            try {
                const { ok, data } = await apiFetch('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });

                if (!ok) {
                    const msg = data.error || 'Login failed. Please try again.';
                    console.error('[Login] Server error:', msg);
                    showError('login-error', msg);
                    return;
                }

                console.log('[Login] Success — welcome back:', data.user?.username);
                localStorage.setItem('testUser', JSON.stringify({ username: data.user?.username, email }));
            } catch (err) {
                console.error('[Login] Unexpected error:', err);
                showError('login-error', 'Something went wrong. Please try again.');
            }
        }
    </script>

</body>

</html>
