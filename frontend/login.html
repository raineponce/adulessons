<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aduLessons | Login</title>

    <!-- Google Fonts or other font imports -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">

    <!-- Global styles -->
    <!-- <link rel="stylesheet" href="./styles/global.css"> -->

    <!-- Page-specific internal styles -->
    <style>
        /* Page-specific CSS goes here */
        #navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
        }
    </style>
</head>

<body>
    <!-- Navigation component loads here -->
    <nav id="navbar"></nav>

    <main>
        <div class="login-container">
            <h1>Let's Grow Together</h1>
            <p>Please log in or sign up to continue.</p>

            <form id="loginForm">
                <input type="email" placeholder="Your Email" required>
                <input type="password" placeholder="Your Password" required>
                <button type="submit" class="login-btn">Login</button>
            </form>

            <div class="signup-link">
                No account? <a href="signup.html">Sign up</a>
            </div>

            <img src="./assets/images/hamsterright.png" alt="Mascot" class="login-mascot">
        </div>
    </main>

    <!-- Footer component loads here -->
    <footer id="footer"></footer>

    <!-- Load components -->
    <script src="../js/components.js"></script>
    <script src="../js/hamburger-menu.js"></script>
</body>

</html>
