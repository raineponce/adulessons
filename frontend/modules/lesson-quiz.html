<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Question | aduLessons</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">

    <!-- Global styles -->
    <!-- <link rel="stylesheet" href="./styles/global.css"> -->

    <!-- Page-specific internal styles -->
    <style>
        /* CSS Variables */
        :root {
            --color-primary: #1a1a2e;
            --color-white: #ffffff;
            --color-text-dark: #2d2d2d;
            --color-text-muted: #6b7280;
            --color-accent-blue: #4a6fa5;
            --color-gold: #ffd700;
            --color-gold-border: #daa520;
            --color-yellow: #e8e4a6;
            --color-orange: #f5c98a;
            --color-green: #b8d4a8;
            --color-light-blue: #c9dff2;
            --color-correct-green: #4a7c59;
            --color-wrong-red: #c97878;
            --font-display: 'Fredoka', sans-serif;
            --font-body: 'Nunito Sans', sans-serif;
        }

        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--color-white);
            color: var(--color-text-dark);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Navigation Styles */
        #navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--color-white);
            border-bottom: 1px solid #eee;
        }

        .nav-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--color-primary);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1;
        }

        .logo-bowtie {
            width: 24px;
            height: auto;
            margin-top: 4px;
        }

        .search-container {
            flex: 0 1 300px;
            margin: 0 2rem;
        }

        .search-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f5f5f5;
            border-radius: 25px;
            padding: 0.5rem 1rem;
        }

        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            font-family: var(--font-body);
            font-size: 0.95rem;
            outline: none;
            color: var(--color-text-muted);
        }

        .search-box input::placeholder {
            color: var(--color-text-muted);
        }

        .search-box svg {
            color: var(--color-text-muted);
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            margin-left: 0.5rem;
        }

        .nav-links {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 2rem;
        }

        .nav-link {
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-text-dark);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .nav-link:hover {
            color: var(--color-accent-blue);
        }

        .user-section {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        .user-avatar-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            transition: transform 0.2s ease;
        }

        .user-avatar-link:hover {
            transform: scale(1.05);
        }

        .avatar-img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid var(--color-gold);
            object-fit: cover;
            background: #f0e6d3;
        }

        .user-name {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--color-text-dark);
        }

        .points-badge-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            transition: transform 0.2s ease;
            padding-top: 8px;
        }

        .points-badge-link:hover {
            transform: scale(1.05);
        }

        .points-text {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--color-text-dark);
        }

        /* Main Content Styles */
        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 5rem;
            position: relative;
        }

        .back-button {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--color-text-dark);
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
            margin-bottom: 1rem;
        }

        .back-button svg {
            width: 24px;
            height: 24px;
        }

        .back-button:hover {
            transform: translateX(-3px);
        }

        /* Quiz Content */
        .quiz-container {
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .quiz-title {
            font-family: var(--font-display);
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--color-text-dark);
            margin-bottom: 1rem;
        }

        .quiz-subtitle {
            font-family: var(--font-body);
            font-size: 1.25rem;
            color: var(--color-text-dark);
            margin-bottom: 2rem;
        }

        .quiz-progress {
            font-family: var(--font-body);
            font-size: 0.95rem;
            color: var(--color-text-muted);
            margin-bottom: 4.5rem;
        }

        .quiz-question {
            font-family: var(--font-body);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-text-dark);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .status-box {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 0.9rem 1rem;
            margin: 0 auto 1rem;
            max-width: 900px;
            color: var(--color-text-muted);
            background: #fafafa;
            font-size: 0.95rem;
            text-align: left;
        }

        .status-box.hidden {
            display: none;
        }

        .status-box.error {
            background: #fff2f2;
            border-color: #f6caca;
            color: #8c2b2b;
        }

        .status-actions {
            margin-top: 0.75rem;
        }

        .retry-button,
        .submit-button,
        .continue-button {
            border: none;
            border-radius: 999px;
            padding: 0.8rem 1.4rem;
            cursor: pointer;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.3rem;
            transition: all 0.2s ease;
        }

        .retry-button {
            border: 1px solid #d1d5db;
            background: #ffffff;
            color: var(--color-text-dark);
        }

        .retry-button:hover {
            background: #f3f4f6;
        }

        .quiz-shell {
            max-width: 900px;
            margin: 0 auto;
        }

        .quiz-question-block {
            margin-bottom: 2rem;
        }

        .answer-card.selected {
            outline: 4px solid rgba(74, 111, 165, 0.35);
            transform: translateY(-3px);
        }

        .answer-card[disabled] {
            cursor: not-allowed;
            opacity: 0.95;
        }

        .quiz-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .submit-button {
            background: var(--color-accent-blue);
            color: var(--color-white);
            min-width: 250px;
            min-height: 70px
        }

        .submit-button:hover:not(:disabled) {
            background: #3d5d8a;
        }

        .submit-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .continue-button {
            background: var(--color-green);
            color: var(--color-text-dark);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 160px;
        }

        .continue-button:hover {
            transform: translateY(-2px);
        }

        .quiz-feedback {
            margin-top: 1.5rem;
            border-radius: 18px;
            padding: 1.25rem 1.5rem;
            text-align: left;
            display: none;
        }

        .quiz-feedback.active {
            display: block;
        }

        .quiz-feedback.correct {
            background: rgba(184, 212, 168, 0.35);
        }

        .quiz-feedback.wrong {
            background: rgba(201, 120, 120, 0.18);
        }

        .quiz-feedback-title {
            font-family: var(--font-display);
            font-size: 1.35rem;
            margin-bottom: 0.5rem;
        }

        .quiz-explanation {
            margin-top: 0.75rem;
            font-size: 1rem;
        }

        .quiz-continue-row {
            display: flex;
            justify-content: center;
            margin-top: 1.5rem;
        }

        /* Answer Grid */
        .answers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .answer-card {
            padding: 1.5rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            border: none;
            font-family: var(--font-body);
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--color-text-dark);
            min-height: 120px;
            display: flex;
            align-items: center;
        }

        .answer-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .answer-a {
            background: var(--color-yellow);
        }

        .answer-b {
            background: var(--color-orange);
        }

        .answer-c {
            background: var(--color-green);
        }

        .answer-d {
            background: var(--color-light-blue);
        }

        /* Result Modal */
        .result-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(26, 25, 32, 0.72);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            padding: 2.5rem;
        }

        .result-modal-overlay.active {
            display: flex;
        }

        .result-modal-card {
            width: 65vw;
            max-width: 1200px;
            min-height: 333px;
            background: #f6f6f7;
            border-radius: 42px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.22);
            position: relative;
            padding: 1.5rem 4.5rem;
            animation: modalSlideIn 0.28s ease;
            overflow: hidden;
        }

        .result-modal-next,
        .result-modal-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .result-modal-next {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            background: #c8dfb2;
            color: #2d2d2d;
        }

        .result-modal-next:hover,
        .result-modal-close:hover {
            transform: scale(1.05);
        }

        .result-modal-next svg {
            width: 42px;
            height: 42px;
        }

        .result-modal-close {
            width: 62px;
            height: 62px;
            border-radius: 12px;
            background: transparent;
            color: #171717;
            font-size: 4rem;
            line-height: 1;
        }

        .result-modal-body {
            height: 100%;
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
        }

        .result-modal-body.wrong-layout .result-modal-mascot {
            order: 1;
        }

        .result-modal-body.wrong-layout .result-modal-copy {
            order: 2;
            text-align: left;
        }

        .result-modal-copy {
            text-align: center;
            max-width: 680px;
        }

        .result-modal-title {
            font-family: var(--font-display);
            font-size: 2.5rem;
            line-height: 1;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.7rem;
        }

        .result-modal-message {
            font-family: var(--font-body);
            font-size: 1.25rem;
            line-height: 1.22;
            color: #1f1f1f;
            margin: 0;
        }

        .result-modal-mascot {
            width: auto;
            height: 190px;
            flex: 0 0 auto;
        }

        .result-modal-overlay.correct .result-modal-title {
            color: var(--color-correct-green);
        }

        .result-modal-overlay.wrong .result-modal-title {
            color: var(--color-wrong-red);
        }

        .result-modal-overlay.wrong .result-modal-body {
            justify-content: center;
        }

        .result-modal-overlay.wrong .result-modal-copy {
            max-width: none;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Styles */
        @media (max-width: 768px) {
            .nav-container {
                flex-wrap: wrap;
                gap: 1rem;
                padding: 1rem;
            }

            .search-container {
                order: 3;
                flex: 1 1 100%;
                margin: 0;
            }

            main {
                padding: 1.5rem 1rem;
            }

            .quiz-title {
                font-size: 2rem;
            }

            .quiz-subtitle {
                font-size: 1rem;
            }

            .quiz-question {
                font-size: 1.125rem;
            }

            .answers-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .answer-card {
                min-height: 80px;
                font-size: 1rem;
            }

            .result-modal-overlay {
                padding: 1rem;
            }

            .result-modal-card {
                width: 100%;
                min-height: 333px;
                border-radius: 28px;
                padding: 3.4rem 1.4rem 2.2rem;
            }

            .result-modal-next,
            .result-modal-close {
                top: 1rem;
                right: 1rem;
            }

            .result-modal-next {
                width: 56px;
                height: 56px;
            }

            .result-modal-next svg {
                width: 32px;
                height: 32px;
            }

            .result-modal-close {
                width: 48px;
                height: 48px;
                font-size: 3rem;
            }

            .result-modal-body {
                min-height: 260px;
                gap: 1rem;
            }

            .result-modal-title {
                font-size: 2.8rem;
                margin-bottom: 0.6rem;
            }

            .result-modal-message {
                font-size: 1.65rem;
            }

            .result-modal-mascot {
                height: 140px;
            }
        }

        @media (max-width: 480px) {
            .user-section {
                gap: 0.5rem;
            }

            .avatar-img {
                width: 40px;
                height: 40px;
            }

            .coin-icon {
                width: 32px;
                height: 32px;
            }

            .quiz-title {
                font-size: 1.75rem;
            }

            .result-modal-card {
                min-height: 320px;
                padding-top: 3rem;
            }

            .result-modal-body,
            .result-modal-overlay.wrong .result-modal-body {
                flex-direction: column;
                text-align: center;
            }

            .result-modal-copy,
            .result-modal-overlay.wrong .result-modal-copy {
                text-align: center;
            }

            .result-modal-message {
                font-size: 1.35rem;
            }

            .result-modal-mascot {
                height: 108px;
            }
        }
    </style>
    <script src="../js/components.js"></script>
</head>

<body>
    <!-- Navigation component loads here -->
    <nav id="navbar">
        <!-- Placeholder navigation - will be replaced by components.js -->
        <div class="nav-container">
            <a href="index.html" class="logo">
                aduLessons
                <!-- bowtie-icon.svg -->
                <svg class="logo-bowtie" viewBox="0 0 24 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 8C12 8 8 4 4 2C2 1 0 2 0 4V12C0 14 2 15 4 14C8 12 12 8 12 8Z" fill="#4a6fa5" />
                    <path d="M12 8C12 8 16 4 20 2C22 1 24 2 24 4V12C24 14 22 15 20 14C16 12 12 8 12 8Z"
                        fill="#4a6fa5" />
                    <circle cx="12" cy="8" r="2" fill="#4a6fa5" />
                </svg>
            </a>

            <div class="search-container">
                <div class="search-box">
                    <input type="text" placeholder="Search">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
            </div>

            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="modules.html" class="nav-link">Modules</a>
            </div>

            <div class="user-section">
                <a href="profile.html" class="user-avatar-link">
                    <!-- user-avatar.png -->
                    <img src="images/user-avatar.png" alt="User Avatar" class="avatar-img"
                        onerror="this.style.background='#f0e6d3'">
                    <span class="user-name">Zoey</span>
                </a>
                <a href="rewards.html" class="points-badge-link">
                    <div class="coin-icon">$</div>
                    <span class="points-text">210 pts</span>
                </a>
            </div>
        </div>
    </nav>

    <main>

        <div id="pageState" class="status-box hidden" aria-live="polite"></div>

        <div class="quiz-container quiz-shell" id="quizShell">
            <h1 class="quiz-title" id="quizTitle">Quiz Question</h1>
            <p class="quiz-subtitle" id="quizSubtitle">Were you paying attention? Let's find out!</p>
            <p class="quiz-progress" id="quizProgressText" aria-live="polite"></p>

            <div class="quiz-question-block">
                <p class="quiz-question" id="quizQuestion"></p>
            </div>

            <div class="answers-grid" id="answersGrid"></div>

            <div class="quiz-actions">
                <button type="button" class="submit-button" id="submitBtn" disabled>Submit Answer</button>
            </div>

            <section class="quiz-feedback" id="quizFeedback" aria-live="polite"></section>

        </div>
    </main>

    <!-- Footer component loads here -->
    <footer id="footer"></footer>

    <div class="result-modal-overlay" id="quizResultModal" role="dialog" aria-modal="true"
        aria-labelledby="resultModalTitle">
        <div class="result-modal-card">
            <button type="button" class="result-modal-next" id="resultModalNext" aria-label="Continue to key takeaways">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>

            <button type="button" class="result-modal-close" id="resultModalClose"
                aria-label="Close wrong answer modal">&times;</button>

            <div class="result-modal-body" id="resultModalBody">
                <div class="result-modal-copy">
                    <h2 class="result-modal-title" id="resultModalTitle"></h2>
                    <p class="result-modal-message" id="resultModalMessage"></p>
                </div>

                <img class="result-modal-mascot" src="../assets/images/mascot-pointer.png" alt="Mascot pointer"
                    loading="lazy">
            </div>
        </div>
    </div>

    <!-- Load components -->
    <script src="../js/hamburger-menu.js"></script>

    <script src="../js/api.js"></script>
    <script src="../js/pages/modules/lesson-quiz.js"></script>
</body>

</html>
