<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modules | aduLessons</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">

    <!-- Global styles -->
    <link rel="stylesheet" href="../css/global.css">

    <!-- Page-specific internal styles -->
    <style>
        :root {
            --color-ink: #1a1a2e;
            --color-text: #2d2d2d;
            --color-muted: #6b7280;
            --color-white: #ffffff;
            --color-button: #345A7A;
            --color-button-hover: #1b2a44;
            --font-display: 'Fredoka', sans-serif;
            --font-body: 'Nunito Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            color: var(--color-text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .site-header {
            position: relative;
        }

        .skip-link {
            position: absolute;
            left: -999px;
            top: 0.75rem;
            background: var(--color-white);
            color: var(--color-ink);
            padding: 0.5rem 1rem;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        }

        .skip-link:focus {
            left: 1rem;
            z-index: 2000;
        }

        #navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--color-white);
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem 1rem 3.5rem;
        }

        .page-header {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 10rem;
            align-items: start;
            margin-bottom: 2.5rem;
        }

        .back-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid #e5e7eb;
            background: var(--color-white);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text);
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        }

        .back-button:hover {
            transform: translateX(-3px);
        }

        .intro-block {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .intro-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .page-title {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--color-text);
        }

        .mascot-mini {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        .section-label {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--color-text);
        }

        .modules-section {
            margin-top: 0.5rem;
        }

        .modules-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        .status-box {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 0.9rem 1rem;
            margin-bottom: 1rem;
            color: var(--color-muted);
            background: #fafafa;
            font-size: 0.95rem;
        }

        .status-box.hidden {
            display: none;
        }

        .status-box.error {
            background: #fff2f2;
            border-color: #f6caca;
            color: #8c2b2b;
        }

        .status-actions {
            margin-top: 0.75rem;
        }

        .retry-button {
            border: 1px solid #d1d5db;
            background: #ffffff;
            border-radius: 999px;
            padding: 0.4rem 0.9rem;
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 700;
            color: var(--color-text);
        }

        .retry-button:hover {
            background: #f3f4f6;
        }

        .module-card {
            --card-bg: #ffffff;
            --card-border: #d1d5db;
            --card-shadow: #9ca3af;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 1rem;
            align-items: center;
            padding: 0.9rem 1.2rem;
            border-radius: 16px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: 6px 6px 0 var(--card-shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .module-card--link {
            cursor: pointer;
        }

        .module-card:hover {
            transform: translateY(-2px);
            box-shadow: 8px 8px 0 var(--card-shadow);
        }

        .module-card img {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }

        .module-title {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--color-text);
            text-align: center;
        }

        .details-button {
            background: var(--color-button);
            color: var(--color-white);
            border: none;
            border-radius: 999px;
            padding: 0.35rem 0.95rem;
            font-family: var(--font-display);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(36, 55, 85, 0.25);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .details-button:hover {
            background: var(--color-button-hover);
            transform: translateY(-1px);
        }

        .details-button:focus-visible,
        .back-button:focus-visible {
            outline: 3px solid #111827;
            outline-offset: 2px;
        }

        .module-card--finance {
            --card-bg: #FFDBE9;
            --card-border: #000000;
            --card-shadow: #ffaad1;
        }

        .module-card--social {
            --card-bg: #F8CDCA;
            --card-border: #000000;
            --card-shadow: #FF938C;
        }

        .module-card--productivity {
            --card-bg: #F3E29F;
            --card-border: #000000;
            --card-shadow: #FED18A;
        }

        .module-card--cooking {
            --card-bg: #F9D599;
            --card-border: #000000;
            --card-shadow: #FAB43B;
        }

        .module-card--household {
            --card-bg: #C5E2AA;
            --card-border: #000000;
            --card-shadow: #7FC042;
        }

        .module-card--transport {
            --card-bg: #C2D0FE;
            --card-border: #000000;
            --card-shadow: #8AA1FE;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            z-index: 2000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 460px;
            background: var(--color-white);
            border-radius: 24px;
            padding: 1.75rem;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
            position: relative;
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: #f3f4f6;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            color: var(--color-text);
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .modal-icon {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .modal-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-text);
        }

        .modal-text {
            color: var(--color-muted);
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        .modal-note {
            font-size: 0.95rem;
            color: var(--color-text);
            background: #fef3c7;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            margin-bottom: 1.25rem;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        .modal-button {
            background: var(--color-button);
            color: var(--color-white);
            border: none;
            border-radius: 999px;
            padding: 0.6rem 1.4rem;
            font-family: var(--font-display);
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .modal-button:hover {
            background: var(--color-button-hover);
        }

        #modalContinue {
            display: none;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        body.modal-open {
            overflow: hidden;
        }

        @media (max-width: 700px) {
            .page-header {
                grid-template-columns: auto;
            }

            .back-button {
                width: 36px;
                height: 36px;
            }

            .module-card {
                grid-template-columns: auto 1fr;
                grid-template-areas:
                    "icon title"
                    "button button";
                row-gap: 0.75rem;
            }

            .module-card img {
                grid-area: icon;
            }

            .module-title {
                grid-area: title;
                text-align: left;
                font-size: 1.2rem;
            }

            .details-button {
                grid-area: button;
                justify-self: end;
            }
        }

        @media (max-width: 480px) {
            main {
                padding: 1.25rem 1rem 3rem;
            }

            .page-title {
                font-size: 1.35rem;
            }

            .modal {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <a class="skip-link" href="#main-content">Skip to content</a>
    </header>

    <!-- Navigation component loads here -->
    <nav id="navbar"></nav>

    <main id="main-content">
        <section class="page-header">
            <a class="back-button" href="../account/dashboard.html" aria-label="Back to home">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </a>
            <div class="intro-block">
                <div class="intro-row">
                    <h1 class="page-title">Start digging, learn something new!</h1>
                    <!-- mascot-wave.png -->
                    <img class="mascot-mini" src="../assets/images/mascot-wave.png" alt="Friendly mascot waving">
                </div>
                <p class="section-label" id="modules-heading">Modules</p>
            </div>
        </section>

        <section class="modules-section" aria-labelledby="modules-heading">
            <div id="pageState" class="status-box hidden" aria-live="polite"></div>
            <ul class="modules-list" id="modulesList" aria-live="polite"></ul>
        </section>
    </main>

    <!-- Footer component loads here -->
    <footer id="footer"></footer>

    <div class="modal-overlay" id="detailsOverlay" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDesc">
            <button class="modal-close" type="button" id="modalClose" aria-label="Close details">&times;</button>
            <div class="modal-header">
                <img class="modal-icon" id="modalIcon" src="../assets/images/finance-icon.png" alt="Module icon">
                <h2 class="modal-title" id="modalTitle">Finance 101</h2>
            </div>
            <p class="modal-text" id="modalDesc">Learn the money basics: budgeting, banking, rent, and saving for goals.
            </p>
            <p class="modal-note" id="modalNote">Choose Continue to open this module's lesson list.</p>
            <div class="modal-actions">
                <a class="modal-button" id="modalContinue" href="../lesson-list.html">Continue</a>
                <button class="modal-button" type="button" id="modalConfirm">Got it</button>
            </div>
        </div>
    </div>

    <!-- Load components -->
    <script src="../js/components.js"></script>
    <script src="../js/hamburger-menu.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/pages/modules/module-list.js"></script>
</body>

</html>
