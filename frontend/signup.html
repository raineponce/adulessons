<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aduLessons | Sign Up</title>

    <!-- Google Fonts or other font imports -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">

    <!-- Global styles -->
    <link rel="stylesheet" href="./css/global.css">

    <!-- Page-specific internal styles -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: #333;
        }

        #navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .signup-container input,
        .signup-container .signup-btn {
            font-family: 'Nunito Sans', sans-serif;
            font-size: 3rem;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .signup-container {
            background-color: #C8E7FF;
            padding: 2rem;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid black;
            box-shadow: 6px 6px 0px #2B5B8B;
            position: relative;
        }

        .signup-container h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #000000;
        }

        .signup-container p {
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            color: #000000;
        }

        .signup-container input {
            width: 100%;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
            border: none;
            border-radius: 15px;
            font-size: 0.95rem;
            box-shadow: 0px 2px 2px #7d7f7c;
        }

        .signup-container input::placeholder {
            color: #676662;
        }

        .signup-container .signup-btn {
            width: 130px;
            padding: 0.8rem;
            background-color: #2f5c96;
            border: none;
            border-radius: 20px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 0.75rem;
            box-shadow: 0px 2px 2px #7d7f7c;
        }

        .signup-container .login-link {
            font-size: 0.85rem;
            color: #000000;
        }

        .signup-container .login-link a {
            font-weight: 600;
            text-decoration: underline;
            color: #000000;
        }

        .signup-mascot {
            position: absolute;
            left: -180px;
            bottom: -10px;
            width: 220px;
        }

        footer {
            font-size: 0.75rem;
            text-align: center;
            padding: 1rem;
            background-color: #f1f1f1;
            color: #555;
        }

        footer a {
            color: #2f5c96;
            text-decoration: none;
            margin: 0 5px;
        }

        @media (max-width: 480px) {
            .signup-container {
                padding: 1.5rem;
            }

            .signup-mascot {
                left: -60px;
                width: 90px;
            }
        }
    </style>
</head>

<body>
    <!-- Navigation component loads here, but not needed in this page-->
    <!--<nav id="navbar"></nav>-->

    <main>
        <div class="signup-container">
            <h1>Sign Up</h1>
            <p>Learn key adulting skills today!</p>

            <form id="signupForm">
                <input type="text" placeholder="Enter Display Name" required>
                <input type="email" placeholder="Your Email" required>
                <input type="password" placeholder="Your Password" required>
                <button type="submit" class="signup-btn">Sign Up</button>
            </form>

            <div class="login-link">
                Already have an account? <a href="login.html">Log in</a>
            </div>

            <img src="./assets/images/mascot-pointer.png" alt="Mascot" class="signup-mascot">
        </div>
    </main>

    <!-- Footer component loads here -->
    <footer id="footer"></footer>

    <!-- Load components -->
    <script src="../js/components.js"></script>
    <script src="../js/hamburger-menu.js"></script>
</body>

</html>
