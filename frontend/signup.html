<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aduLessons | Sign Up</title>

    <!-- Google Fonts or other font imports -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"

<body>
    <!-- Navigation component loads here, but not needed in this page-->
    <!--<nav id="navbar"></nav>-->

    <main>
        <div class="signup-container">
            <h1>Sign Up</h1>
            <p>Learn key adulting skills today!</p>

            <form id="signupForm">
                <input type="text" placeholder="Enter Display Name" required>
                <input type="email" placeholder="Your Email" required>
                <input type="password" placeholder="Your Password" required>
                <button type="submit" class="signup-btn">Sign Up</button>
            </form>

            <div class="login-link">
                Already have an account? <a href="index.html">Log in</a>
            </div>

            <img src="./assets/images/mascot-pointer.png" alt="Mascot" class="signup-mascot">
        </div>
    </main>

    <!-- Footer component loads here -->
    <footer id="footer"></footer>

    <!-- Load components -->
    <script src="../js/components.js"></script>
    <script src="../js/hamburger-menu.js"></script>
</body>
