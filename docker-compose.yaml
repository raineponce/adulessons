services:
  app:
    build: .
    container_name: adulessons-app
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    volumes:
      - ./frontend:/app/frontend
      - ./backend:/app/backend
      - ./content:/app/content
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - SESSION_SECRET=${SESSION_SECRET}

  mongo:
    image: mongo:7
    container_name: adulessons-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
